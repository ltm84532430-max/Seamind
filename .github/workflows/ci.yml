name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm@9.15.9 install --frozen-lockfile
      - run: corepack pnpm@9.15.9 -r build:types
      - run: corepack pnpm@9.15.9 -r build:js
      - run: corepack pnpm@9.15.9 lint
      - run: corepack pnpm@9.15.9 test
      - run: corepack pnpm@9.15.9 --filter @markmap/desktop exec tsc --noEmit -p tsconfig.json
      - run: node --test apps/desktop/tests/*.test.mjs

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Cargo Check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Cargo Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

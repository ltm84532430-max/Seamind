[package]
name = "markmap-desktop"
version = "0.1.0"
description = "A desktop Markdown mind map editor powered by Markmap"
authors = ["Markmap Desktop"]
edition = "2021"

[lib]
name = "markmap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "sync", "time"] }
url = "2"
roxmltree = "0.21.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5"] }
tauri-plugin-dialog = "2"
notify = "8"
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
